name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Unit tests (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The suite starts no Spring context and opens no database, so this is the
      # whole check: services, filters, rules and helpers. See docs/TEST-PLAN.md
      # for what it cannot prove.
      - name: Verify
        working-directory: backend
        run: ./mvnw -B -ntp verify

  production-jar:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Package
        working-directory: backend
        run: ./mvnw -B -ntp -Pproduction -DskipTests package

      - name: Upload the JAR
        uses: actions/upload-artifact@v4
        with:
          name: leave-platform-jar
          path: backend/target/leave-platform-*.jar
          if-no-files-found: error
